[project]
name = "bchatpn"
version = "1.0.0"
description = "Self-contained BChat push-notification server (onion-request ingress)"
requires-python = ">=3.11"
# The core needs exactly one third-party package.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# Only needed for the real APNs transport (APNs requires HTTP/2).
apns = ["httpx[http2]>=0.27"]
# Optional faster event loop.
fast = ["uvloop>=0.19"]

[project.scripts]
bchatpn = "bchatpn.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bchatpn", "bchatpn.providers", "bchatpn.secure"]
